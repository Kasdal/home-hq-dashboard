server {
    listen 80;
    server_name _;

    root /site/current;
    index index.html;
    disable_symlinks off;
    autoindex off;

    gzip on;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Data files live outside the release folders, so a deploy keeps them.
    location /data/ {
        alias /sitedata/;
        add_header Cache-Control "no-store";
    }

    location = /version.json {
        add_header Cache-Control "no-store";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
